<h2 class="h5">Add a session</h2>
<form method="post" class="card card-body shadow-sm">{% csrf_token %}
  {% for error in form.non_field_errors %}<div class="alert alert-danger">{{ error }}</div>{% endfor %}
  {% for field in form %}{% include "includes/field.html" %}{% endfor %}
  <button class="btn btn-primary">Add session</button>
</form>
