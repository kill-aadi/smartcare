{% extends "base.html" %}
{% block title %}Add pharmacy{% endblock %}
{% block nav %}{% include "dashboards/hospital/_nav.html" %}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <h1 class="h3">Add a pharmacy</h1>
  <form method="post" class="card card-body shadow-sm">{% csrf_token %}
    {% for field in form %}{% include "includes/field.html" %}{% endfor %}
    <div class="d-flex gap-2">
      <button class="btn btn-primary">Save</button>
      <a class="btn btn-link" href="{% url 'dashboards:hospital-pharmacies' %}">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
