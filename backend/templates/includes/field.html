<div class="mb-3">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
         class="form-control{% if field.errors %} is-invalid{% endif %}"
         {% if field.value is not None and field.field.widget.input_type != 'password' and field.field.widget.input_type != 'file' %}value="{{ field.value }}"{% endif %}
         {% if field.field.required %}required{% endif %}>
  {% for error in field.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
</div>
