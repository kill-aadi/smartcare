[project]
name = "smartcare-backend"
version = "0.1.0"
description = "SmartCare Django backend: web dashboards and the patient REST API"
requires-python = "==3.12.*"
dependencies = [
    "django==5.2.19",
    "django-environ==0.14.0",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.9",
]

[dependency-groups]
dev = [
    "factory-boy==3.3.3",
    "faker==40.63.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--reuse-db"

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "config/*", "manage.py"]

[tool.coverage.report]
include = [
    "*/services.py",
    "*/permissions.py",
    "*/queue.py",
    "ai_suggest/*.py",
    "*/mixins.py",
    "core/*.py",
]
fail_under = 80
show_missing = true
