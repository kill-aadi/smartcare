name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartcare
          POSTGRES_PASSWORD: smartcare
          POSTGRES_DB: smartcare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartcare -d smartcare"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://smartcare:smartcare@localhost:5432/smartcare
      SECRET_KEY: ci-only-not-secret-long-enough-for-hs256
      DEBUG: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build backend image
        run: docker build -t smartcare-backend:ci backend
